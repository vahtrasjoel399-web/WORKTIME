<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#0b1320">
    <div style="max-width:560px;margin:32px auto;padding:32px;background:#ffffff;border-radius:16px">
      <h2 style="margin:0 0 12px">Welcome to Tööaeg</h2>
      <p style="line-height:1.6">Your employer invited you to activate your worker account.</p>
      <p style="margin:28px 0">
        <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=invite" style="display:inline-block;padding:13px 20px;border-radius:10px;background:#f4c95d;color:#0b1320;text-decoration:none;font-weight:700">
          Create my password
        </a>
      </p>
      <p style="font-size:13px;line-height:1.5;color:#637083">This is a one-time invitation. If you were not expecting it, you can ignore this email.</p>
    </div>
  </body>
</html>
